# /etc/nginx/conf.d/default.conf

# --- HTTP : uniquement ACME + redirect vers HTTPS ---
server {
  listen 80;
  server_name tauruss.top www.tauruss.top;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# --- HTTPS : frontend + API ---
server {
  listen 443 ssl;
  http2 on;
  server_name tauruss.top www.tauruss.top;

  ssl_certificate     /etc/letsencrypt/live/tauruss.top/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tauruss.top/privkey.pem;

  resolver 127.0.0.11 valid=30s;  # Docker's internal DNS

  # Frontend (React SPA)
  location / {
    set $frontend http://frontend:80;
    proxy_pass $frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_intercept_errors on;
    error_page 404 = /index.html;
  }

  # API Django
  location /api/ {
    set $backend http://backend:8000;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Admin Django
  location /admin/ {
    set $backend http://backend:8000;
    proxy_pass $backend/admin/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}