# /etc/nginx/conf.d/default.conf

# --- HTTP : uniquement ACME + redirect vers HTTPS ---
server {
  listen 80;
  server_name tauruss.top www.tauruss.top;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# --- HTTPS : frontend + API ---
server {
  listen 443 ssl;
  http2 on;
  server_name tauruss.top www.tauruss.top;

  ssl_certificate     /etc/letsencrypt/live/tauruss.top/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tauruss.top/privkey.pem;

  resolver 127.0.0.11 valid=30s;  # Docker's internal DNS

  # Security headers (the API also gets these from Django).
  # The CSP can't restrict scripts (script-src): the ad loader (AdManagerLoader.js) runs inline
  # code that loads from domains that change every day. It still blocks plugins, <base>
  # hijacking, other sites framing this one (clickjacking), forms posting elsewhere, and
  # upgrades any http:// resource to https://.
  # Every location with its own add_header must repeat these: see "include" below.
  include /etc/nginx/conf.d/security-headers.inc;

  # Compress text assets (JS bundle, CSS, JSON, sitemaps, SVG logo)
  gzip on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

  # Frontend files (the build + public/). A URL that isn't a file (an app page such as
  # /movies/123, or a page that doesn't exist) goes to @spa.
  location / {
    set $frontend http://frontend:80;
    proxy_pass $frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_intercept_errors on;
    # on here (where the first error_page runs), so @spa's own fallback below can run too
    recursive_error_pages on;
    error_page 404 = @spa;
  }

  # The home page's HTML names the current JS bundles: always re-checked.
  location ~ ^/(index\.html)?$ {
    set $frontend http://frontend:80;
    proxy_pass $frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/conf.d/security-headers.inc;
  }

  # Built JS / CSS / fonts / images: the file names carry a content hash, so a new build gets
  # new names and these can be kept for a year. A missing file stays a 404 (no app page).
  location ^~ /static/ {
    set $frontend http://frontend:80;
    proxy_pass $frontend;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/conf.d/security-headers.inc;
  }

  # App pages, from Django (backend users/seo.py): index.html with the page's own title,
  # description, preview image, canonical + hreflang links, and a real 404 for unknown URLs.
  location @spa {
    set $backend http://backend:8000;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # backend down / restarting: the plain index.html, so the site keeps working
    proxy_intercept_errors on;
    error_page 502 503 504 = @spa_fallback;
  }

  location @spa_fallback {
    set $frontend http://frontend:80;
    rewrite ^ /index.html break;
    proxy_pass $frontend;
    proxy_set_header Host $host;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/conf.d/security-headers.inc;
  }

  # Sitemaps: built from the database by Django (users/seo.py)
  location ~ ^/sitemap[\w-]*\.xml$ {
    set $backend http://backend:8000;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Installable app files: always re-checked, so a new service worker / manifest is picked up
  # on the next visit (a long-cached service worker keeps users on an old version).
  # add_header here replaces the server-level ones, so they are repeated.
  location ~ ^/(service-worker\.js|manifest\.json)$ {
    set $frontend http://frontend:80;
    proxy_pass $frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/conf.d/security-headers.inc;
  }

  # API Django
  location /api/ {
    set $backend http://backend:8000;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # History import uploads (Letterboxd / IMDb exports): up to 10 MB, checked again by Django
  # (reco/imports.py). Everywhere else nginx keeps its 1 MB default.
  location = /api/import/files/ {
    client_max_body_size 11m;
    set $backend http://backend:8000;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Django admin (path = ADMINADMIN_URL in backend/.env).
  # /admin/* itself is a React route, handled by "location /" above.
  location /super-admin-7b0e/ {
    set $backend http://backend:8000;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Django static files (admin CSS/JS), collected into the static_vol volume
  location /django-static/ {
    alias /vol/static/;
    expires 7d;
    access_log off;
  }
}