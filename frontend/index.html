<!DOCTYPE html>

<head>
  <!-- ===== Core ===== -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />

  <!-- ===== Font (design system: Inter) ===== -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />

  <!-- ===== Primary SEO ===== -->
  <title>Tauruss – Stream Movies & TV Shows Online in HD</title>
  <meta name="description" content="Tauruss lets you stream thousands of movies and TV shows instantly in HD. Watch anytime, anywhere — on any device." />
  <meta name="author" content="Tauruss" />
  <link rel="canonical" href="https://tauruss.top/" />

  <!-- ===== Crawler hints ===== -->
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <meta name="googlebot" content="index, follow" />

  <!-- ===== Open Graph (Facebook, LinkedIn, iMessage previews) ===== -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Tauruss" />
  <meta property="og:title" content="Tauruss – Stream Movies & TV Shows Online in HD" />

  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Tauruss streaming platform" />
  <meta property="og:locale" content="en_US" />

  <!-- ===== Twitter / X ===== -->

  <meta name="twitter:title" content="Tauruss – Stream Movies & TV Shows Online in HD" />
  <meta name="twitter:description" content="Stream thousands of movies and TV shows instantly in HD. Watch anytime, anywhere." />
  <meta name="twitter:image" content="https://tauruss.top/logo/og-image.jpg" />
  <meta name="twitter:image:alt" content="Tauruss streaming platform" />

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Tauruss" />

  <!-- ===== Structured Data (JSON-LD) ===== -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Tauruss",
    "url": "https://tauruss.top/",
    "description": "Stream thousands of movies and TV shows instantly in HD. Watch anytime, anywhere.",
    "potentialAction": {
      "@type": "SearchAction",
      "target": {
        "@type": "EntryPoint",
        "urlTemplate": "https://tauruss.top/search?q={search_term_string}"
      },
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Tauruss",
    "url": "https://tauruss.top/",
    "logo": "https://tauruss.top/logo/favicon-512x512.png"
  }
  </script>

  <!-- ===== Start-up splash (shown while the app downloads; React replaces it) =====
       Same animation as the BrandLoader component (src/design/BrandLoader.js, components.css) -->
  <style>
    html, body { background: #08080a; }
    .boot { position: fixed; inset: 0; display: grid; place-items: center;
      background: radial-gradient(60% 50% at 50% 45%, rgba(229, 9, 20, 0.1), transparent 70%), #08080a; }
    .boot svg { width: 96px; height: auto; overflow: visible; animation: boot-glow 2.6s ease-in-out infinite; }
    .boot path.p { fill: #e50914; fill-opacity: 0; stroke: #e50914; stroke-width: 7; stroke-linejoin: round;
      stroke-dasharray: 1; stroke-dashoffset: 1; animation: boot-draw 2.6s cubic-bezier(.65, 0, .35, 1) infinite; }
    .boot path.p2 { animation-name: boot-draw-late; }
    .boot rect { animation: boot-shine 2.6s cubic-bezier(.45, 0, .55, 1) infinite; }
    @keyframes boot-draw { 0% { stroke-dashoffset: 1; fill-opacity: 0; opacity: 1; } 34% { stroke-dashoffset: 0; fill-opacity: 0; }
      50% { fill-opacity: 1; } 82% { stroke-dashoffset: 0; fill-opacity: 1; opacity: 1; } 100% { stroke-dashoffset: 0; fill-opacity: 1; opacity: 0; } }
    @keyframes boot-draw-late { 0%, 10% { stroke-dashoffset: 1; fill-opacity: 0; opacity: 1; } 42% { stroke-dashoffset: 0; fill-opacity: 0; }
      56% { fill-opacity: 1; } 82% { stroke-dashoffset: 0; fill-opacity: 1; opacity: 1; } 100% { stroke-dashoffset: 0; fill-opacity: 1; opacity: 0; } }
    @keyframes boot-shine { 0%, 54% { transform: translateX(0); } 80%, 100% { transform: translateX(640px); } }
    @keyframes boot-glow { 0%, 40% { filter: drop-shadow(0 0 0 rgba(229, 9, 20, 0)); }
      62% { filter: drop-shadow(0 0 14px rgba(229, 9, 20, .55)); } 100% { filter: drop-shadow(0 0 0 rgba(229, 9, 20, 0)); } }
    @media (prefers-reduced-motion: reduce) {
      .boot svg, .boot path.p, .boot rect { animation: none; }
      .boot path.p { fill-opacity: 1; stroke: none; }
    }
  </style>
</head>
