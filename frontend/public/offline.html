<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Offline – Tauruss</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #000; color: #e5e5e5;
      font-family: Arial, Helvetica, sans-serif; text-align: center; padding: 24px; box-sizing: border-box;
    }
    img { width: 72px; height: 72px; margin-bottom: 20px; }
    h1 { font-size: 22px; margin: 0 0 10px; color: #fff; }
    p { margin: 0 0 24px; color: #aaa; line-height: 1.5; }
    button {
      background: #e50914; color: #fff; border: 0; border-radius: 6px;
      padding: 12px 24px; font-size: 16px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="/logo/favicon-192x192.png" alt="Tauruss">
    <h1>You're offline</h1>
    <p>Check your internet connection, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>
    // come back by itself as soon as the connection is back
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
