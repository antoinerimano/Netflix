# Dependency updates: at most one pull request per ecosystem per month, every update in it grouped,
# each one tested by the CI before it can be merged.
# Major versions are left out: they usually need code changes (React 19 and testing-library 14+
# don't work with react-scripts 5, Django 6 needs MySQL 8.4): those are upgraded on purpose.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 15.5.1+ requires TypeScript 5, react-scripts 5 installs 4: `npm ci` fails (ERESOLVE)
      - dependency-name: "react-i18next"
        versions: [">=15.5.1"]
      # 0.31 ignores the responsive settings: home rows showed ~6 small cards instead of 4 at
      # 1280 px (caught by e2e/tests/tv-remote.spec.js)
      - dependency-name: "react-slick"
        versions: [">=0.31.0"]
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      e2e:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      backend:
        patterns: ["*"]
