# CI / CD
#   every push and pull request: backend tests (MySQL), frontend tests, translations, production build
#   push to main, once everything passed: deploy to the server over SSH (docker compose)
#
# Deploy setup (GitHub > Settings > Environments > "production"):
#   secrets   SSH_HOST, SSH_USER, SSH_PRIVATE_KEY (a key allowed on the server), SSH_PORT (optional, 22)
#   variables DEPLOY_ENABLED = true (the deploy job is skipped until then)
#             DEPLOY_PATH (optional, default /opt/taurus: a git clone of this repo with its .env files)
#             HEALTHCHECK_URL (optional, e.g. https://tauruss.top/api/providers/: must answer 200 after deploy)
#   Add "Required reviewers" on the environment to approve each deploy by hand.
name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Django tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: user_data_db
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_DEBUG: "1"
      DB_NAME: user_data_db
      DB_USER: root
      DB_PASSWORD: root
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: System packages (mysqlclient build, gettext)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends default-libmysqlclient-dev pkg-config gettext

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # sentence-transformers (PyTorch, several GB) only serves the build_embeddings command
      - name: Install dependencies
        run: |
          grep -v -i '^sentence-transformers' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt

      - name: Django checks
        run: python manage.py check

      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Translations compile
        run: for po in locale/*/LC_MESSAGES/django.po; do msgfmt --check -o /dev/null "$po"; done

      - name: Tests
        run: python manage.py test --noinput

  frontend:
    name: Frontend (tests, translations, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20" # same as frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Translations (same keys, plurals and placeholders in every language)
        run: npm run i18n:check

      - name: Tests
        run: npm test -- --watchAll=false
        env:
          CI: "true"

      - name: Production build (warnings fail it)
        run: npm run build
        env:
          CI: "true"

  deploy:
    name: Deploy
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false # never stop a deploy halfway
    steps:
      - name: Pull, rebuild and migrate on the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 25m
          script_stop: true
          script: |
            set -e
            cd "${{ vars.DEPLOY_PATH || '/opt/taurus' }}"
            git fetch origin main
            # only fast-forward: a server with local changes stops the deploy instead of losing them
            git merge --ff-only origin/main
            git log -1 --format='Deploying %h %s'
            docker compose up -d --build backend frontend
            docker compose exec -T backend python manage.py migrate --noinput
            docker image prune -f

      - name: Health check
        if: vars.HEALTHCHECK_URL != ''
        run: |
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null "${{ vars.HEALTHCHECK_URL }}"; then echo "up"; exit 0; fi
            sleep 6
          done
          echo "::error::${{ vars.HEALTHCHECK_URL }} did not answer after the deploy"
          exit 1
