{% load i18n %}{# Bulletproof button (table cell keeps its padding in Gmail and Outlook) + a link to copy if it's blocked. #}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:8px 0 20px 0;">
  <tr>
    <td align="center" bgcolor="#e50914" style="border-radius:6px;">
      <a href="{{ url }}" target="_blank"
         style="display:inline-block; padding:12px 24px; font-family:Arial, Helvetica, sans-serif; font-size:16px; font-weight:bold; color:#ffffff; text-decoration:none; border-radius:6px;">{{ label }}</a>
    </td>
  </tr>
</table>
<p style="margin:0 0 16px 0; font-size:13px; line-height:19px; color:#555555;">
  {% translate "If the button doesn't work, copy this link into your browser:" %}<br>
  <a href="{{ url }}" style="color:#e50914; word-break:break-all;">{{ url }}</a>
</p>
