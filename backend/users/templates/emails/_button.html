{% load i18n %}{# Bulletproof button (table cell keeps its padding in Gmail and Outlook) + a link to copy if it's blocked. #}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:26px 0 26px 0;">
  <tr>
    <td align="center" bgcolor="#e50914" style="background-color:#e50914; border-radius:999px;">
      <a href="{{ url }}" target="_blank"
         style="display:inline-block; padding:15px 34px; font-family:'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:17px; line-height:20px; font-weight:700; letter-spacing:0.2px; color:#ffffff; text-decoration:none; border-radius:999px;">{{ label }}&nbsp;{% if text_dir == "rtl" %}&larr;{% else %}&rarr;{% endif %}</a>
    </td>
  </tr>
</table>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 6px 0;">
  <tr>
    <td bgcolor="#f6f4f1" style="background-color:#f6f4f1; border-radius:12px; padding:14px 18px; font-size:13px; line-height:20px; color:#6b6873;">
      {% translate "If the button doesn't work, copy this link into your browser:" %}<br>
      <a href="{{ url }}" style="color:#e50914; word-break:break-all;">{{ url }}</a>
    </td>
  </tr>
</table>
