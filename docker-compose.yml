# container logs (docker compose logs): at most 3 x 10 MB per service
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mysql:8.0
    # binary logs: 3 days (MySQL default 30 filled the disk, ~0.5 GB per home snapshot rebuild)
    command: ["--default-authentication-plugin=mysql_native_password", "--binlog-expire-logs-seconds=259200"]
    environment:
      # Only read when the database is created (empty mysql_data volume): an existing database
      # keeps its own password. Set it in .env next to this file (see .env.example), the same
      # as DB_PASSWORD in backend/.env.
      MYSQL_DATABASE: user_data_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:3306:3306"    

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    depends_on:
      - db
    volumes:
      - static_vol:/vol/static
      - media_vol:/vol/media
    expose:
      - "8000"
    restart: unless-stopped
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "80"
    restart: unless-stopped
    logging: *default-logging

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/security-headers.inc:/etc/nginx/conf.d/security-headers.inc:ro
      - static_vol:/vol/static:ro
      - media_vol:/vol/media:ro
      - certbot_www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    logging: *default-logging

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    restart: "no"
    logging: *default-logging

volumes:
  mysql_data:
  static_vol:
  media_vol:
  certbot_www:
  letsencrypt:
